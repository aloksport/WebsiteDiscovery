# Live server: Apache (sed-abeo.com, HTTPS) forwards /websitediscovery/* to
# this container on 127.0.0.1:8070 (see docker-compose.prod.yml and the
# .htaccess in /home/adminroot/public_html/websitediscovery), and this passes
# it on to the app container.
server {
    listen 80;
    server_name sed-abeo.com www.sed-abeo.com;

    client_max_body_size 5m;

    # Docker's internal DNS. Looking "app" up per request (via the variable
    # below) instead of once at startup means rebuilding/recreating the app
    # container (new internal IP) doesn't leave this proxy pointing at the old
    # one and returning 502s.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $app_upstream http://app:4000;

    location = / {
        return 302 /websitediscovery/;
    }

    location = /websitediscovery {
        return 301 /websitediscovery/;
    }

    location /websitediscovery/ {
        # With a variable and no URI part, the original request URI is passed
        # through unchanged (e.g. /websitediscovery/admin/questions).
        proxy_pass $app_upstream;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
