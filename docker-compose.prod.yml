# Production stack for the live server (sed-abeo.com): PostgreSQL + a single
# built image (API + admin panel + public questionnaire page) + an nginx
# proxy. Request flow:
#   Apache (HTTPS, public_html/websitediscovery/.htaccess)
#     -> 127.0.0.1:8070 (nginx container, nginx/default.conf)
#     -> app:4000 (app container)
# Nothing here is published on a public interface except the database port
# (see the note on db below). See docs/SETUP_WEBSERVER.md.
#
# Reads DB_NAME / DB_USER / DB_PASSWORD / BASE_PATH from a .env file next to
# this one (copy .env.example to .env and fill in real values first).

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # Published on every interface so remote DB tools can connect. If that
    # isn't needed, use "127.0.0.1:5433:5432" instead.
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Baked into the admin panel's build - must be the same value as
        # the BASE_PATH env var below.
        VITE_BASE_PATH: ${BASE_PATH:-/websitediscovery}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      BASE_PATH: ${BASE_PATH:-/websitediscovery}
      JWT_SECRET: ${JWT_SECRET}
    # Live traffic reaches the app through the nginx container over the
    # internal Docker network, not this port. It is published on 127.0.0.1
    # only, for checks from the server itself (curl http://127.0.0.1:4001/...).
    ports:
      - "127.0.0.1:4001:4000"
  # ==========================================================
  # Nginx Reverse Proxy
  # ==========================================================

  nginx:     
    image: nginx:alpine     
    restart: unless-stopped     
    depends_on: 
      - app     
    ports:
      - "127.0.0.1:8070:80"
    volumes:
     - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

volumes:
  db_data:
